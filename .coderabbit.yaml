# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit config for poli-page repos. PRs here are mostly opened and fixed by automated agents
# (the poli-page auto loop and issue pipeline), which read CodeRabbit's findings and its commit status.
language: en-US
early_access: false
reviews:
  profile: chill
  request_changes_workflow: false
  allow_author_approval: true
  # The summary goes in the walkthrough, never in the PR description: the merge gate reads the description.
  high_level_summary: false
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: false
  # The loop decides "reviewed this head" from the CodeRabbit commit status ("Review completed").
  review_progress: true
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: true
  # PR labels are the closed issues' labels; CodeRabbit only suggests.
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  disable_cache: false
  slop_detection:
    enabled: true
    include_all_authors: false
  auto_review:
    enabled: true
    drafts: false
    # Every push of a fix round must be reviewed, and never auto-paused (the loop allows up to 5 rounds).
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
  pre_merge_checks:
    docstrings:
      mode: "off"
  path_filters:
    - "!**/go.sum"
    - "!**/coverage.*"
    - "!**/*.out"
    - "!**/vendor/**"
    - "!example-app/output/**"
  path_instructions:
    - path: "*.go"
      instructions: >-
        Root package is a Gin integration wrapping the poli-page Go SDK. Keep the public API small and
        consistent with the other poli-page SDKs and the API spec (errors are `{ error: { code } }`).
        No breaking changes to exported identifiers without a major version. Idiomatic Go: wrap errors
        with %w, never swallow them, pass context through *gin.Context, no package-level client singleton.
    - path: "**/*_test.go"
      instructions: >-
        Every exported function (middleware, response helpers, config loader, error mapping) needs a test.
        Prefer table-driven tests with httptest and assert headers (Content-Type, Cache-Control,
        X-Content-Type-Options, Content-Disposition) and the JSON error shape.
    - path: "example-app/**"
      instructions: >-
        Sample code that customers copy: check correctness, idiomatic Gin usage, and security. No secrets
        in code; the API key comes from POLI_PAGE_API_KEY. Handlers must map *polipage.Error properly and
        escape/validate user input. Keep it consistent with the README.
    - path: "cmd/**"
      instructions: >-
        Smoke-test CLI (cobra). Flags must match docs/cli.md and the README; read the API key from the
        environment, never print it, and return non-zero exit codes on failure.
    - path: "{README.md,docs/**,CHANGELOG.md}"
      instructions: >-
        Docs must match the code: code samples compile against the current API, flag names and env vars
        are accurate, and user-visible changes have a CHANGELOG entry.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
