name: Release

# Tag-triggered release, as in poli-page/sdk-go. A Go module has no upload
# step: pushing the vX.Y.Z tag publishes the module, and proxy.golang.org
# indexes it on the first request for that version. This workflow cannot hold
# a tag back, so the gate is scripts/check-release-versions.sh, run before the
# tag is pushed (CONTRIBUTING.md, "Each release"); the verify job re-runs the
# version checks on the tag itself, so a mismatching tag shows up red at once
# and can be retracted before anyone depends on it. When verify is green, the
# release job creates the GitHub Release, with the CHANGELOG section as its
# notes.
#
# The full test matrix runs on the same push: ci.yml triggers on every push,
# tags included.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # prereleases (e.g. v0.14.0-rc.1)

permissions:
  contents: read

jobs:
  verify:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The module shares its major.minor with the Poli Page API: a release
      # X.Y.z must pass the API contract X.Y and require
      # github.com/poli-page/sdk-go vX.Y.z. The script checks the CHANGELOG
      # section of the release (the module has no version constant), the SDK
      # requirement of go.mod and example-app/go.mod, and the contract commit
      # the workflows pin: a stable contract tag vX.Y.Z on it with the tag's
      # major.minor.
      - name: CHANGELOG, required SDK and pinned API contract match the tag
        run: ./scripts/check-release-versions.sh "${GITHUB_REF_NAME}"

  release:
    name: Create GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      # Pull the matching CHANGELOG section for the release body. Falls back to
      # a pointer if the section is absent so the release never fails on notes.
      - name: Extract CHANGELOG section
        id: changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && /^## \[/             { exit }
            capture                         { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "_See [CHANGELOG.md](CHANGELOG.md) for details._" > "$notes"
          fi
          echo "notes_file=$notes" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=()
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --verify-tag \
            --notes-file "${{ steps.changelog.outputs.notes_file }}" \
            "${prerelease[@]}"
