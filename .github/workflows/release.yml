name: Release

# Tag-triggered release checks, as in poli-page/sdk-go. A Go module has no
# upload step: pushing the vX.Y.Z tag is the release, and proxy.golang.org
# indexes it on the first request for that version. This workflow cannot hold
# a tag back, so the gate is scripts/check-release-versions.sh, run before the
# tag is pushed (CONTRIBUTING.md, "Each release"); this re-runs the version
# checks on the tag itself, so a mismatching tag shows up red at once and can
# be retracted before anyone depends on it.
#
# The full test matrix runs on the same push: ci.yml triggers on every push,
# tags included.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*' # prereleases (e.g. v0.14.0-rc.1)

permissions:
  contents: read

jobs:
  verify:
    name: Version matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The module has no version constant: the tag is its version, and the
      # CHANGELOG section of the release is where the repository names it.
      - name: CHANGELOG has the release section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## [${version}] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}] - YYYY-MM-DD' section"
            exit 1
          fi
          echo "CHANGELOG.md has the ${version} section"

      # The module shares its major.minor with the Poli Page API: a release
      # X.Y.z must pass the API contract X.Y and require
      # github.com/poli-page/sdk-go vX.Y.z. The script reads the contract
      # commit ci.yml pins, requires a stable contract tag vX.Y.Z on it with
      # the tag's major.minor, and checks the SDK requirement of go.mod and
      # example-app/go.mod.
      - name: Pinned API contract and required SDK match the tag's major.minor
        run: ./scripts/check-release-versions.sh "${GITHUB_REF_NAME}"
