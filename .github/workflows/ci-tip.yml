name: CI (Go tip)

# Early-warning coverage against the unreleased Go toolchain. Kept out of the
# push/PR CI on purpose: a Go-tip break is upstream news, not a reason to red a
# commit. Runs nightly and on demand; check it when it goes red.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  test-tip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # setup-go cannot resolve a literal "tip"; bootstrap with stable, then
      # install the toolchain via golang.org/dl/gotip and put its `go` on PATH
      # so every step below runs under tip without per-step rewrites.
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Install Go tip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download
          echo "$HOME/sdk/gotip/bin" >> "$GITHUB_PATH"
      - name: Go version
        run: go version
      - name: Pin Gin version
        run: |
          go get github.com/gin-gonic/gin@v1.10.0
          go mod tidy
          cd example-app
          go get github.com/gin-gonic/gin@v1.10.0
          go mod tidy
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -d .; exit 1)
      - name: Vet
        run: |
          go vet ./...
          (cd example-app && go vet ./...)
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Unit tests (race)
        env:
          CI: 'true'
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: go test -race -count=1 ./...
      # example-app/contract_test.go runs the contract's impl cases.
      - name: Example app tests and API contract (race)
        working-directory: example-app
        env:
          CI: 'true'
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          test -s "$POLI_CONTRACT" || { echo "::error::API contract file missing: '$POLI_CONTRACT'"; exit 1; }
          go test -race -count=1 -v ./...
      - name: Build
        run: |
          go build ./...
          (cd example-app && go build ./...)
