name: CI
on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25']
        gin: ['v1.9.1', 'v1.10.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: false
      # Every step below is strict: a failed install, build or check fails
      # the job; none of them skips on any leg.
      - name: Pin Gin version
        run: |
          go get github.com/gin-gonic/gin@${{ matrix.gin }}
          go mod tidy
          cd example-app
          go get github.com/gin-gonic/gin@${{ matrix.gin }}
          go mod tidy
      - name: Format check
        run: test -z "$(gofmt -l .)" || (gofmt -d .; exit 1)
      - name: Vet
        run: |
          go vet ./...
          (cd example-app && go vet ./...)
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
      - name: Lint example-app
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: example-app
      - name: API contract
        id: contract
        uses: poli-page/api-contract@0eba96c1ecf9a28b7e259f444f3ca5b7c059d5fd # v1.3.0
      - name: Unit tests (race)
        env:
          CI: 'true'
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: go test -race -count=1 ./...
      # example-app/contract_test.go runs the contract's impl cases against
      # the example app. With CI set it fails, never skips, when
      # POLI_CONTRACT is missing.
      - name: Example app tests and API contract (race)
        working-directory: example-app
        env:
          CI: 'true'
          POLI_CONTRACT: ${{ steps.contract.outputs.path }}
        run: |
          test -s "$POLI_CONTRACT" || { echo "::error::API contract file missing: '$POLI_CONTRACT'"; exit 1; }
          go test -race -count=1 -v ./...
      - name: Build
        run: |
          go build ./...
          (cd example-app && go build ./...)

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          path: gin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Integration test (gated on POLI_PAGE_API_KEY)
        working-directory: gin
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_TEST_BASE_URL: ${{ secrets.POLI_PAGE_TEST_BASE_URL }}
        run: |
          if [ -z "$POLI_PAGE_API_KEY" ]; then
            echo "POLI_PAGE_API_KEY not set; skipping integration test"
            exit 0
          fi
          if [ ! -d tests/integration ] || [ -z "$(ls -A tests/integration 2>/dev/null)" ]; then
            echo "No tests/integration yet; skipping"
            exit 0
          fi
          go test -tags=integration -count=1 ./tests/integration/...
      - name: CLI smoke test
        working-directory: gin
        env:
          POLI_PAGE_API_KEY: ${{ secrets.POLI_PAGE_API_KEY }}
          POLI_PAGE_BASE_URL: ${{ secrets.POLI_PAGE_TEST_BASE_URL }}
        run: |
          if [ -z "$POLI_PAGE_API_KEY" ]; then
            echo "POLI_PAGE_API_KEY not set; skipping CLI smoke"
            exit 0
          fi
          if [ ! -d cmd/polipage-render ]; then
            echo "No cmd/polipage-render yet; skipping"
            exit 0
          fi
          go run ./cmd/polipage-render \
              --project=getting-started \
              --template=welcome \
              --data='{"name":"ci"}' \
              -o /tmp/welcome.pdf
          test -s /tmp/welcome.pdf
